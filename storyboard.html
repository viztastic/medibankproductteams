e-height:1.02;font-weight:600;letter-spacing:-0.025em;margin:22px 0 0;max-width:16ch;text-wrap:pretty\">Product Operating Model<\u002Fh1>\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:48px;margin-top:28px;flex-wrap:wrap\">\n    <p style=\"font-size:19px;line-height:1.55;color:oklch(0.42 0.012 250);margin:0;max-width:52ch;text-wrap:pretty\">Three videos. A 90 second film of Medibank people describing what POM changed for them, and two animated explainers carrying the definitions the short film has no room for.<\u002Fp>\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.9;color:oklch(0.52 0.012 250);text-align:right\">\n      <div>Prepared for HR / People &amp; Culture<\u002Fdiv>\n      <div>Draft for internal review<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:18px 22px;background:oklch(0.94 0.028 12);border-bottom:1px solid oklch(0.86 0.04 12)\">\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.45 0.14 12);margin-bottom:6px\">Casting<\u002Fdiv>\n  <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:oklch(0.3 0.05 12);max-width:88ch\">Michael Spiteri, Anthony Candy, Rob Cass, Emily Bhasin and Eamon Logue are stand-ins so we can test the cut before we film. The quotes are drafted to show the shape of answer each frame needs: length, register, level of detail. Swap in what the real interviews give us.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"margin-top:72px\">\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.52 0.012 250);margin-bottom:26px\">The package<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:oklch(0.86 0.008 250);border:1px solid oklch(0.86 0.008 250)\">\n    <div style=\"background:oklch(0.995 0.003 250);padding:30px 26px 34px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;color:oklch(0.52 0.14 12)\">FILM 01<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:oklch(0.52 0.012 250)\">1:30<\u002Fdiv>\n      <\u002Fdiv>\n      <h3 style=\"font-size:23px;font-weight:600;letter-spacing:-0.015em;margin:14px 0 10px;line-height:1.2\">What POM unlocked<\u002Fh3>\n      <p style=\"margin:0;font-size:14px;line-height:1.6;color:oklch(0.44 0.012 250)\">Five staff, intercut. No narrator and no graphics beyond title cards. The whole job is credibility, and teams believe colleagues.<\u002Fp>\n      <div style=\"margin-top:18px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.8;color:oklch(0.52 0.012 250)\">Interview footage<br>Candid, unpolished<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:oklch(0.995 0.003 250);padding:30px 26px 34px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;color:oklch(0.52 0.14 12)\">FILM 02<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:oklch(0.52 0.012 250)\">2:30<\u002Fdiv>\n      <\u002Fdiv>\n      <h3 style=\"font-size:23px;font-weight:600;letter-spacing:-0.015em;margin:14px 0 10px;line-height:1.2\">What is POM<\u002Fh3>\n      <p style=\"margin:0;font-size:14px;line-height:1.6;color:oklch(0.44 0.012 250)\">Animated, voiceover only. Defines the vocabulary, shows the portfolio as a map, and states plainly who decides what.<\u002Fp>\n      <div style=\"margin-top:18px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.8;color:oklch(0.52 0.012 250)\">Motion graphics<br>Single VO artist<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:oklch(0.995 0.003 250);padding:30px 26px 34px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;color:oklch(0.52 0.14 12)\">FILM 03<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:oklch(0.52 0.012 250)\">2:30<\u002Fdiv>\n      <\u002Fdiv>\n      <h3 style=\"font-size:23px;font-weight:600;letter-spacing:-0.015em;margin:14px 0 10px;line-height:1.2\">What is a product plan<\u002Fh3>\n      <p style=\"margin:0;font-size:14px;line-height:1.6;color:oklch(0.44 0.012 250)\">Animated, built around one real redacted plan on screen. Walks its sections, then shows how it rolls up to the portfolio.<\u002Fp>\n      <div style=\"margin-top:18px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.8;color:oklch(0.52 0.012 250)\">Motion graphics<br>Artefact on screen<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:20px 0 0;font-size:14px;line-height:1.6;color:oklch(0.5 0.012 250);max-width:80ch\">Film 01 is the invitation and travels on its own through Yammer, town halls and team meetings. Films 02 and 03 sit behind it for anyone who watches and asks what POM actually is.<\u002Fp>\n<\u002Fdiv>\n\n<sc-if value=\"{{ showGuide }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"margin-top:96px;padding-top:36px;border-top:2px solid oklch(0.24 0.012 250)\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:16px\">\n    <h2 style=\"font-size:34px;font-weight:600;letter-spacing:-0.02em;margin:0\">Interview day<\u002Fh2>\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:oklch(0.52 0.012 250)\">5 people &nbsp;·&nbsp; ~20 min each &nbsp;·&nbsp; 6 questions<\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:16px 0 34px;font-size:16px;line-height:1.6;color:oklch(0.44 0.012 250);max-width:70ch\">Ask all six of everyone. We need one usable answer per question across the five, and we won't know who gives it until we're in the room. Open with recollection rather than definition. People perform when they define and relax when they recount.<\u002Fp>\n  <div style=\"display:grid;gap:1px;background:oklch(0.86 0.008 250);border:1px solid oklch(0.86 0.008 250)\">\n    <div style=\"background:oklch(0.995 0.003 250);padding:24px 26px;display:grid;grid-template-columns:44px 1fr 300px;gap:26px;align-items:start\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:oklch(0.52 0.14 12)\">Q1<\u002Fdiv>\n      <div style=\"font-size:17.5px;line-height:1.45;font-weight:500\">Walk me through how your team decided what to work on, before any of this started.<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:oklch(0.5 0.012 250)\">Warm up. Gets the \"before\" on tape as memory rather than complaint. Version A depends on it.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:oklch(0.995 0.003 250);padding:24px 26px;display:grid;grid-template-columns:44px 1fr 300px;gap:26px;align-items:start\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:oklch(0.52 0.14 12)\">Q2<\u002Fdiv>\n      <div style=\"font-size:17.5px;line-height:1.45;font-weight:500\">What does POM mean to you?<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:oklch(0.5 0.012 250)\">Short and open. The best answers come before people have time to make them official.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:oklch(0.995 0.003 250);padding:24px 26px;display:grid;grid-template-columns:44px 1fr 300px;gap:26px;align-items:start\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:oklch(0.52 0.14 12)\">Q3<\u002Fdiv>\n      <div style=\"font-size:17.5px;line-height:1.45;font-weight:500\">If you had to explain a product plan to someone in your family, what would you say?<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:oklch(0.5 0.012 250)\">Forces plain language. Best source for the Film 03 opening line.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:oklch(0.995 0.003 250);padding:24px 26px;display:grid;grid-template-columns:44px 1fr 300px;gap:26px;align-items:start\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:oklch(0.52 0.14 12)\">Q4<\u002Fdiv>\n      <div style=\"font-size:17.5px;line-height:1.45;font-weight:500\">Tell me about a specific thing your product plan sorted out that used to be a stalemate.<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:oklch(0.5 0.012 250)\">Ask for one story, then wait. The pause is where the specifics come from.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:oklch(0.995 0.003 250);padding:24px 26px;display:grid;grid-template-columns:44px 1fr 300px;gap:26px;align-items:start\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:oklch(0.52 0.14 12)\">Q5<\u002Fdiv>\n      <div style=\"font-size:17.5px;line-height:1.45;font-weight:500\">What can you see across other squads and hubs now that you couldn't see before?<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:oklch(0.5 0.012 250)\">Targets the interdependency and duplication payoff directly.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:oklch(0.995 0.003 250);padding:24px 26px;display:grid;grid-template-columns:44px 1fr 300px;gap:26px;align-items:start\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:oklch(0.52 0.14 12)\">Q6<\u002Fdiv>\n      <div style=\"font-size:17.5px;line-height:1.45;font-weight:500\">What was hard about the change, and what would you say to a team about to go through it?<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:oklch(0.5 0.012 250)\">Two answers in one. The first buys the credibility that makes the second land. This is the closer.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:26px;display:grid;grid-template-columns:repeat(2,1fr);gap:26px\">\n    <div style=\"padding:22px 24px;background:oklch(0.995 0.003 250);border:1px solid oklch(0.86 0.008 250)\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.52 0.012 250);margin-bottom:10px\">On the day<\u002Fdiv>\n      <p style=\"margin:0;font-size:14px;line-height:1.65;color:oklch(0.38 0.012 250)\">Shoot in their own workspace. Let the room be audible. Roll before you start asking and keep rolling through the laugh at the end of an answer, because that is usually the frame we open on.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"padding:22px 24px;background:oklch(0.995 0.003 250);border:1px solid oklch(0.86 0.008 250)\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.52 0.012 250);margin-bottom:10px\">House rules<\u002Fdiv>\n      <p style=\"margin:0;font-size:14px;line-height:1.65;color:oklch(0.38 0.012 250)\">No scripted lines and no autocue. If someone offers a sentence that sounds like it came off a slide, ask the question again a different way and use the second answer.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"margin-top:100px;padding-top:36px;border-top:2px solid oklch(0.24 0.012 250)\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:16px\">\n    <div>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.52 0.14 12)\">Film 01 &nbsp;·&nbsp; Version A<\u002Fdiv>\n      <h2 style=\"font-size:38px;font-weight:600;letter-spacing:-0.022em;margin:12px 0 0\">Before / After<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250);text-align:right\">11 frames &nbsp;·&nbsp; 1:30<br>Two title cards, no VO<\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:20px 0 8px;font-size:16.5px;line-height:1.6;color:oklch(0.44 0.012 250);max-width:74ch;text-wrap:pretty\">The first third is the old way, told honestly. Then a title card and a beat of silence, and the rest is what replaced it. The structure carries the argument so nobody on camera has to sell anything.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"margin-top:34px;border-top:1px solid oklch(0.86 0.008 250)\">\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">01<\u002Fspan><br>0:00–0:07<br>7s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">ROB CASS, MCU, seated at<br>his desk, laughing at the<br>start of the answer.<br>Room noise. No music.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.55 0.012 250);margin-bottom:6px\">Cold open<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.07em;text-transform:uppercase;color:oklch(0.52 0.14 12)\">Rob Cass <span style=\"color:oklch(0.55 0.012 250);letter-spacing:0.03em\">&nbsp;·&nbsp; Product Owner<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:18px;line-height:1.5;color:oklch(0.2 0.012 250);max-width:52ch\">\"Honestly? Eighteen months ago I couldn't have told you what the squad next door was building. And we shared half the same system.\"<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:oklch(0.5 0.012 250)\">Hold the lower third. Let the viewer wonder who this is for seven seconds.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">02<\u002Fspan><br>0:07–0:10<br>3s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:oklch(0.22 0.012 250);display:flex;align-items:center;padding:20px\">\n      <div style=\"font-family:'Libre Franklin',sans-serif;font-size:24px;font-weight:600;letter-spacing:-0.02em;color:oklch(0.96 0.005 250)\">Before<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.55 0.012 250);margin-bottom:6px\">Title card<\u002Fdiv>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:oklch(0.32 0.012 250)\">Hard cut to black. One word, set left, no animation. Audio drops to silence for a beat, then the next answer starts over the card.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:12px 14px;background:oklch(0.94 0.006 250);border:1px solid oklch(0.88 0.008 250);font-family:'JetBrains Mono',monospace;font-size:11.5px;color:oklch(0.35 0.012 250)\">ON SCREEN &nbsp;“Before”<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">03<\u002Fspan><br>0:10–0:20<br>10s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">Two fast cuts. ANTHONY,<br>then EMILY. Tighter framing<br>than F1. First lower thirds<br>appear here.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:16px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.07em;text-transform:uppercase;color:oklch(0.52 0.14 12)\">Anthony Candy <span style=\"color:oklch(0.55 0.012 250);letter-spacing:0.03em\">&nbsp;·&nbsp; Squad Lead<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:18px;line-height:1.5;color:oklch(0.2 0.012 250);max-width:52ch\">\"Everything was priority one. Which is the same as nothing being priority one.\"<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.07em;text-transform:uppercase;color:oklch(0.52 0.14 12)\">Emily Bhasin <span style=\"color:oklch(0.55 0.012 250);letter-spacing:0.03em\">&nbsp;·&nbsp; Product Owner<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:18px;line-height:1.5;color:oklch(0.2 0.012 250);max-width:52ch\">\"We'd sign up to twelve months of work. By month three most of it wasn't true any more. Everyone knew. We just kept reporting on it.\"<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">04<\u002Fspan><br>0:20–0:28<br>8s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">EAMON LOGUE, standing,<br>window light behind.<br>Cutaway mid answer to an<br>empty meeting room.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.07em;text-transform:uppercase;color:oklch(0.52 0.14 12)\">Eamon Logue <span style=\"color:oklch(0.55 0.012 250);letter-spacing:0.03em\">&nbsp;·&nbsp; Squad Lead<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:18px;line-height:1.5;color:oklch(0.2 0.012 250);max-width:52ch\">\"The hard part was never doing the work. It was getting agreement on which work, and that could take a quarter on its own.\"<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:oklch(0.5 0.012 250)\">The cutaway is the only visual joke in the film. Use it once.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">05<\u002Fspan><br>0:28–0:36<br>8s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">MICHAEL SPITERI, widest<br>framing in the film.<br>Unhurried. Holds the<br>pause before answering.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.07em;text-transform:uppercase;color:oklch(0.52 0.14 12)\">Michael Spiteri <span style=\"color:oklch(0.55 0.012 250);letter-spacing:0.03em\">&nbsp;·&nbsp; General Manager<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:18px;line-height:1.5;color:oklch(0.2 0.012 250);max-width:52ch\">\"We were funding projects. Projects finish and the team gets broken up. The customer problem doesn't finish, so we'd start it again next year with new people, from scratch.\"<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:oklch(0.5 0.012 250)\">This is the pivot. Everything after it answers it.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">06<\u002Fspan><br>0:36–0:40<br>4s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:oklch(0.22 0.012 250);display:flex;align-items:center;padding:20px\">\n      <div style=\"font-family:'Libre Franklin',sans-serif;font-size:22px;font-weight:600;letter-spacing:-0.02em;line-height:1.25;color:oklch(0.96 0.005 250)\">Then we changed<br>how we plan<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.55 0.012 250);margin-bottom:6px\">Title card &nbsp;·&nbsp; full silence<\u002Fdiv>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:oklch(0.32 0.012 250)\">Four seconds with no audio at all. It will feel long in the edit and read correctly on a screen at a town hall.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:12px 14px;background:oklch(0.94 0.006 250);border:1px solid oklch(0.88 0.008 250);font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.6;color:oklch(0.35 0.012 250)\">ON SCREEN &nbsp;“Then we changed how we plan”<br>Deliberately avoids the phrase “launched POM”.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">07<\u002Fspan><br>0:40–0:52<br>12s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">EMILY, then B roll: her own<br>product plan on a monitor,<br>over the shoulder. Real<br>document, redacted.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.07em;text-transform:uppercase;color:oklch(0.52 0.14 12)\">Emily Bhasin<\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:18px;line-height:1.5;color:oklch(0.2 0.012 250);max-width:52ch\">\"A product plan is one page. This is the product, this is the number we're trying to move, this is what we're doing about it this quarter, and this is what we're leaving out. That last part changed how my team works.\"<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:oklch(0.5 0.012 250)\">Only place in Film 01 we show the artefact. Two seconds is enough. Film 03 does the detail.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">08<\u002Fspan><br>0:52–1:02<br>10s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">ANTHONY, then ROB.<br>B roll between: a squad<br>standing at a board,<br>shot from behind.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:16px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.07em;text-transform:uppercase;color:oklch(0.52 0.14 12)\">Anthony Candy<\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:18px;line-height:1.5;color:oklch(0.2 0.012 250);max-width:52ch\">\"Same team, same product, quarter after quarter. We stopped losing the first three weeks of everything to people working out who they were.\"<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.07em;text-transform:uppercase;color:oklch(0.52 0.14 12)\">Rob Cass<\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:18px;line-height:1.5;color:oklch(0.2 0.012 250);max-width:52ch\">\"I can open the portfolio now and read every squad's plan. First time I did it I found another team already halfway through something we'd just scoped.\"<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">09<\u002Fspan><br>1:02–1:11<br>9s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">EAMON, tight, no cutaway.<br>We want to watch him do<br>the arithmetic before<br>he answers.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.07em;text-transform:uppercase;color:oklch(0.52 0.14 12)\">Eamon Logue<\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:18px;line-height:1.5;color:oklch(0.2 0.012 250);max-width:52ch\">\"Idea to something a customer can actually use is about half what it was. Nobody's working harder. We've stopped waiting for permission.\"<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:oklch(0.5 0.012 250)\">If a cleared cycle time number exists, replace \"about half\" with it. A real number here is worth more than the rest of the film.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">10<\u002Fspan><br>1:11–1:22<br>11s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">MICHAEL, same setup as F5.<br>Returning to the same frame<br>signals the film closing<br>its own loop.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.55 0.012 250);margin-bottom:6px\">The honest note<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.07em;text-transform:uppercase;color:oklch(0.52 0.14 12)\">Michael Spiteri<\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:18px;line-height:1.5;color:oklch(0.2 0.012 250);max-width:52ch\">\"It wasn't comfortable. We had to stop things we'd already told people were coming. We commit to less now, and far more of what we commit to actually turns up.\"<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:oklch(0.5 0.012 250)\">Keep this frame even if the cut runs long. It is what stops the film reading as promotion.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">11<\u002Fspan><br>1:22–1:30<br>8s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">EMILY, direct to lens.<br>Then cut to end card on the<br>dark background used for<br>the title cards.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.07em;text-transform:uppercase;color:oklch(0.52 0.14 12)\">Emily Bhasin<\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:18px;line-height:1.5;color:oklch(0.2 0.012 250);max-width:52ch\">\"If your team hasn't started yet, come and sit in one of our planning sessions. There's no framework to learn. It's a clearer way of arguing about what matters.\"<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:12px 14px;background:oklch(0.94 0.006 250);border:1px solid oklch(0.88 0.008 250);font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:oklch(0.35 0.012 250)\">END CARD<br>Product Operating Model<br>Two short explainers, and who to talk to &nbsp;→ [link]<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<sc-if value=\"{{ showB }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"margin-top:100px;padding-top:36px;border-top:2px solid oklch(0.24 0.012 250)\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:16px\">\n    <div>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.52 0.14 12)\">Film 01 &nbsp;·&nbsp; Version B<\u002Fdiv>\n      <h2 style=\"font-size:38px;font-weight:600;letter-spacing:-0.022em;margin:12px 0 0\">One question each<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250);text-align:right\">7 frames &nbsp;·&nbsp; 1:30<br>Question cards as the only graphic<\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:20px 0 8px;font-size:16.5px;line-height:1.6;color:oklch(0.44 0.012 250);max-width:74ch;text-wrap:pretty\">Same footage, different architecture. Each person owns one question, and the question appears on screen before they answer. Rougher than A and far more forgiving in the edit: if one interview underdelivers you swap the question instead of restructuring the film. The trade is the emotional arc that A builds.<\u002Fp>\n  <div style=\"margin-top:22px;padding:18px 22px;background:oklch(0.995 0.003 250);border:1px solid oklch(0.86 0.008 250);font-size:14.5px;line-height:1.65;color:oklch(0.38 0.012 250);max-width:88ch\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.52 0.14 12);display:block;margin-bottom:8px\">Which to shoot<\u002Fspan>Shoot for A. Its structure depends on the \"before\" answers, so Q1 has to be asked properly and given time. If the interviews land, B can be cut from the same rushes in an afternoon.\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top:34px;border-top:1px solid oklch(0.86 0.008 250)\">\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">01<\u002Fspan><br>0:00–0:06<br>6s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:oklch(0.22 0.012 250);display:flex;align-items:flex-end;padding:20px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.5;color:oklch(0.96 0.005 250)\">We asked five people<br>five questions.<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.55 0.012 250);margin-bottom:6px\">Open<\u002Fdiv>\n      <p style=\"margin:0;font-size:15px;line-height:1.6;color:oklch(0.32 0.012 250);max-width:56ch\">Typed on in monospace, in silence. Under it, five 0.4 second portraits, everyone mid thought and nobody speaking. Then straight into Q1.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">02<\u002Fspan><br>0:06–0:23<br>17s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">Question card, 2s, then<br>MICHAEL SPITERI, MCU.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div style=\"padding:12px 14px;background:oklch(0.94 0.006 250);border:1px solid oklch(0.88 0.008 250);font-family:'JetBrains Mono',monospace;font-size:12px;color:oklch(0.3 0.012 250)\">Q. So what is this, actually?<\u002Fdiv>\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.07em;text-transform:uppercase;color:oklch(0.52 0.14 12)\">Michael Spiteri <span style=\"color:oklch(0.55 0.012 250);letter-spacing:0.03em\">&nbsp;·&nbsp; General Manager<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:18px;line-height:1.5;color:oklch(0.2 0.012 250);max-width:52ch\">\"We used to fund projects, and projects end. Now we fund teams that stay with a product, and every quarter they tell us what they're going after. That's most of it. The rest is detail.\"<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">03<\u002Fspan><br>0:23–0:40<br>17s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">Question card, then EMILY,<br>with over shoulder B roll of<br>a redacted plan on her<br>second monitor.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div style=\"padding:12px 14px;background:oklch(0.94 0.006 250);border:1px solid oklch(0.88 0.008 250);font-family:'JetBrains Mono',monospace;font-size:12px;color:oklch(0.3 0.012 250)\">Q. What's a product plan?<\u002Fdiv>\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.07em;text-transform:uppercase;color:oklch(0.52 0.14 12)\">Emily Bhasin <span style=\"color:oklch(0.55 0.012 250);letter-spacing:0.03em\">&nbsp;·&nbsp; Product Owner<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:18px;line-height:1.5;color:oklch(0.2 0.012 250);max-width:52ch\">\"One page. What the product is, the number we're trying to move, what we're doing this quarter, and what we're leaving out. Writing down what we're leaving out was the hardest page I've written and the most useful.\"<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">04<\u002Fspan><br>0:40–0:57<br>17s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">Question card, then ROB<br>CASS at his desk. He tells<br>this as a story, so hold<br>on him the whole way.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div style=\"padding:12px 14px;background:oklch(0.94 0.006 250);border:1px solid oklch(0.88 0.008 250);font-family:'JetBrains Mono',monospace;font-size:12px;color:oklch(0.3 0.012 250)\">Q. What did it sort out for your team?<\u002Fdiv>\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.07em;text-transform:uppercase;color:oklch(0.52 0.14 12)\">Rob Cass <span style=\"color:oklch(0.55 0.012 250);letter-spacing:0.03em\">&nbsp;·&nbsp; Product Owner<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:18px;line-height:1.5;color:oklch(0.2 0.012 250);max-width:52ch\">\"We'd scoped a piece of work for about three weeks. Then I read another hub's plan and they were already building it. Three weeks, and a conversation we should have had on day one.\"<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">05<\u002Fspan><br>0:57–1:12<br>15s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">Question card, then ANTHONY<br>standing at a squad board.<br>Only frame with visible team<br>activity behind.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div style=\"padding:12px 14px;background:oklch(0.94 0.006 250);border:1px solid oklch(0.88 0.008 250);font-family:'JetBrains Mono',monospace;font-size:12px;color:oklch(0.3 0.012 250)\">Q. What changed about prioritising?<\u002Fdiv>\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.07em;text-transform:uppercase;color:oklch(0.52 0.14 12)\">Anthony Candy <span style=\"color:oklch(0.55 0.012 250);letter-spacing:0.03em\">&nbsp;·&nbsp; Squad Lead<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:18px;line-height:1.5;color:oklch(0.2 0.012 250);max-width:52ch\">\"Everything used to be priority one. Now the whole hub's plans sit side by side once a quarter and you can see the trade offs in the room. Same arguments. They're just faster, and they finish.\"<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">06<\u002Fspan><br>1:12–1:25<br>13s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">Question card, then EAMON.<br>Leave the hesitation in.<br>Keep the pause before<br>he answers.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div style=\"padding:12px 14px;background:oklch(0.94 0.006 250);border:1px solid oklch(0.88 0.008 250);font-family:'JetBrains Mono',monospace;font-size:12px;color:oklch(0.3 0.012 250)\">Q. What was hard about it?<\u002Fdiv>\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.07em;text-transform:uppercase;color:oklch(0.52 0.14 12)\">Eamon Logue <span style=\"color:oklch(0.55 0.012 250);letter-spacing:0.03em\">&nbsp;·&nbsp; Squad Lead<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:18px;line-height:1.5;color:oklch(0.2 0.012 250);max-width:52ch\">\"Saying out loud what we weren't going to do. That's uncomfortable when you've already told people it's coming. It still beats promising everything and quietly delivering some of it.\"<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">07<\u002Fspan><br>1:25–1:30<br>5s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:oklch(0.22 0.012 250);display:flex;align-items:flex-end;padding:20px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.5;color:oklch(0.96 0.005 250)\">Your squad's next.<br>Two explainers → [link]<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.55 0.012 250);margin-bottom:6px\">End card<\u002Fdiv>\n      <p style=\"margin:0;font-size:15px;line-height:1.6;color:oklch(0.32 0.012 250);max-width:56ch\">Same typed treatment as the open, so the film closes where it started. No music sting.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"margin-top:100px;padding-top:36px;border-top:2px solid oklch(0.24 0.012 250)\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:16px\">\n    <div>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.52 0.14 12)\">Film 02 &nbsp;·&nbsp; Explainer<\u002Fdiv>\n      <h2 style=\"font-size:38px;font-weight:600;letter-spacing:-0.022em;margin:12px 0 0\">What is POM<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250);text-align:right\">7 scenes &nbsp;·&nbsp; 2:30<br>Motion graphics, VO only<\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:20px 0 8px;font-size:16.5px;line-height:1.6;color:oklch(0.44 0.012 250);max-width:74ch;text-wrap:pretty\">VO is written for a normal speaking pace. Graphics carry the structure and the voice carries the meaning, so the two never say the same thing at the same time.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"margin-top:34px;border-top:1px solid oklch(0.86 0.008 250)\">\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">01<\u002Fspan><br>0:00–0:22<br>22s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">A twelve month bar draws<br>left to right. Reality<br>arrives as marks that push<br>it out of shape until it<br>becomes unreadable.<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.55 0.012 250);margin-bottom:8px\">The problem<\u002Fdiv>\n      <p style=\"margin:0;font-size:17px;line-height:1.6;color:oklch(0.2 0.012 250);max-width:58ch\">\"For a long time we planned a year at a time. Business cases, funding rounds, a list of projects. It worked right up until the year stopped behaving like the plan. Then we'd spend nine months explaining variance instead of changing course.\"<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">02<\u002Fspan><br>0:22–0:38<br>16s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:oklch(0.22 0.012 250);display:flex;align-items:center;padding:20px\">\n      <div style=\"font-family:'Libre Franklin',sans-serif;font-size:17px;font-weight:500;line-height:1.35;letter-spacing:-0.01em;color:oklch(0.96 0.005 250)\">Fund teams, not projects.<br>Plan quarterly, not annually.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.55 0.012 250);margin-bottom:8px\">Definition<\u002Fdiv>\n        <p style=\"margin:0;font-size:17px;line-height:1.6;color:oklch(0.2 0.012 250);max-width:58ch\">\"The product operating model is a different answer to the same question: how do we decide what to work on. We fund a standing team that owns a product, and every quarter we ask them what they're going after and why.\"<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:oklch(0.5 0.012 250)\">Type only. Gives the viewer somewhere still to land before the vocabulary arrives.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">03<\u002Fspan><br>0:38–1:12<br>34s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">Five terms build one at a<br>time, each staying on screen<br>as the next appears. By the<br>end all five are visible<br>together as a stack.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.55 0.012 250);margin-bottom:8px\">Vocabulary<\u002Fdiv>\n        <p style=\"margin:0;font-size:17px;line-height:1.6;color:oklch(0.2 0.012 250);max-width:58ch\">\"Five words you'll hear constantly. A <strong style=\"font-weight:600\">product<\u002Fstrong> is something we run and improve for customers, with no end date. A <strong style=\"font-weight:600\">squad<\u002Fstrong> is the standing team that owns one. A <strong style=\"font-weight:600\">hub<\u002Fstrong> is the group of squads working on related products. An <strong style=\"font-weight:600\">outcome<\u002Fstrong> is the change we're trying to cause, written as a number. And a <strong style=\"font-weight:600\">product plan<\u002Fstrong> is the one page where a squad says which outcome it's chasing next quarter.\"<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:oklch(0.5 0.012 250)\">Check these five against Medibank's own glossary before recording. Where the house term differs, use the house term.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">04<\u002Fspan><br>1:12–1:42<br>30s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">PORTFOLIO MAP. Real hub and<br>product names. Camera pushes<br>back from one squad to the<br>whole portfolio in a single<br>continuous move.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.55 0.012 250);margin-bottom:8px\">The map<\u002Fdiv>\n        <p style=\"margin:0;font-size:17px;line-height:1.6;color:oklch(0.2 0.012 250);max-width:58ch\">\"Written down, all of it looks like this. Every product we run, grouped into hubs, each with a squad and a plan attached. People find this the most useful part and the least expected. You can see the whole portfolio on one screen, and find who owns the thing you need without asking four people first.\"<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:oklch(0.5 0.012 250)\">Use the actual taxonomy. Recognising their own hub names is what makes the scene work. Needs a cleared export from the portfolio team.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">05<\u002Fspan><br>1:42–2:02<br>20s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">The year drawn as four short<br>blocks. A marker moves<br>across, and at each boundary<br>the blocks ahead visibly<br>change.<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.55 0.012 250);margin-bottom:8px\">The cadence<\u002Fdiv>\n      <p style=\"margin:0;font-size:17px;line-height:1.6;color:oklch(0.2 0.012 250);max-width:58ch\">\"The rhythm is quarterly. Squads refresh their plans, hubs read them side by side, and we agree what's in and what waits. Nothing is locked for a year, so nothing has to be defended for a year either. When something isn't working, the next decision point is weeks away.\"<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">06<\u002Fspan><br>2:02–2:22<br>20s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">Three plain rows: SQUAD /<br>HUB / LEADERSHIP. One<br>decision phrase lands in<br>each row as the VO<br>names it.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.55 0.012 250);margin-bottom:8px\">Who decides what<\u002Fdiv>\n        <p style=\"margin:0;font-size:17px;line-height:1.6;color:oklch(0.2 0.012 250);max-width:58ch\">\"Everyone asks who actually decides. The squad decides how to solve the problem. The hub decides which problems matter most this quarter and where the people go. Leadership decides what we're in business to improve, and holds the standard on outcomes. If you're in a squad, more of this is yours than it used to be, and it comes with having to say no in public.\"<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:oklch(0.5 0.012 250)\">Needs sign off from whoever owns decision rights. Keep it specific. \"We all decide together\" is the version people don't believe.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">07<\u002Fspan><br>2:22–2:30<br>8s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:oklch(0.22 0.012 250);display:flex;align-items:flex-end;padding:20px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.6;color:oklch(0.96 0.005 250)\">Next: what is a product plan<br>→ [link]<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.55 0.012 250);margin-bottom:8px\">Close<\u002Fdiv>\n      <p style=\"margin:0;font-size:17px;line-height:1.6;color:oklch(0.2 0.012 250);max-width:58ch\">\"That's the model. Almost all of it shows up in one artefact, which is where the next two and a half minutes go.\"<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<div style=\"margin-top:100px;padding-top:36px;border-top:2px solid oklch(0.24 0.012 250)\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:16px\">\n    <div>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.52 0.14 12)\">Film 03 &nbsp;·&nbsp; Explainer<\u002Fdiv>\n      <h2 style=\"font-size:38px;font-weight:600;letter-spacing:-0.022em;margin:12px 0 0\">What is a product plan<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250);text-align:right\">7 scenes &nbsp;·&nbsp; 2:30<br>One real plan, on screen throughout<\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:20px 0 8px;font-size:16.5px;line-height:1.6;color:oklch(0.44 0.012 250);max-width:74ch;text-wrap:pretty\">Single continuous set: one redacted plan from a real squad, held on screen for the whole film while the camera moves across it. No slide transitions. The argument is that this is an ordinary document an ordinary team can write in an afternoon.<\u002Fp>\n  <div style=\"margin-top:22px;padding:18px 22px;background:oklch(0.94 0.028 12);border:1px solid oklch(0.86 0.04 12);font-size:14.5px;line-height:1.65;color:oklch(0.3 0.05 12);max-width:88ch\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.45 0.14 12);display:block;margin-bottom:8px\">Clear this before animation starts<\u002Fspan>Pick the hero plan. It has to be a genuine plan from a squad willing to be named, with numbers redacted rather than replaced by invented ones. A mocked up plan gets spotted immediately and costs the film its argument.\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top:34px;border-top:1px solid oklch(0.86 0.008 250)\">\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">01<\u002Fspan><br>0:00–0:18<br>18s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">A thick stack of documents<br>collapses into a single<br>page. Hold on the page,<br>still too small to read.<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.55 0.012 250);margin-bottom:8px\">Open<\u002Fdiv>\n      <p style=\"margin:0;font-size:17px;line-height:1.6;color:oklch(0.2 0.012 250);max-width:58ch\">\"A product plan replaces a business case. It's a page, sometimes two, that a squad writes and keeps current. Anyone in the company can open it and find out what a team is doing and why.\"<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">02<\u002Fspan><br>0:18–0:34<br>16s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">THE HERO PLAN, full page,<br>readable. Section headings<br>highlight in sequence as<br>the VO counts them.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.55 0.012 250);margin-bottom:8px\">The whole artefact<\u002Fdiv>\n        <p style=\"margin:0;font-size:17px;line-height:1.6;color:oklch(0.2 0.012 250);max-width:58ch\">\"This is a real one. Five parts. The product and who it's for. The outcome we're chasing. How we'll know it's working. What we're doing about it this quarter. And what we're leaving out. That's the whole document.\"<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:oklch(0.5 0.012 250)\">Match these section names exactly to the live template. If the template has six sections, this film has six.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">03<\u002Fspan><br>0:34–1:00<br>26s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">Push in on the OUTCOME<br>section. Beside it a weaker<br>version of the same line<br>appears, then is struck<br>through.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.55 0.012 250);margin-bottom:8px\">The outcome<\u002Fdiv>\n        <p style=\"margin:0;font-size:17px;line-height:1.6;color:oklch(0.2 0.012 250);max-width:58ch\">\"The outcome is the only genuinely hard part. It has to be a change in the world, with a number on it. \"Launch the new claims flow\" is a thing we build. \"Cut the time it takes a member to submit a claim\" is an outcome, because it stays true even if the first thing we build doesn't work.\"<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:oklch(0.5 0.012 250)\">Use a real pair from an actual plan revision if one is available. Much more persuasive than an invented example.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">04<\u002Fspan><br>1:00–1:24<br>24s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">Pan to WHAT WE'RE LEAVING<br>OUT. Items fade in one by<br>one and stay. Longest single<br>hold in the film.<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.55 0.012 250);margin-bottom:8px\">What we're leaving out<\u002Fdiv>\n      <p style=\"margin:0;font-size:17px;line-height:1.6;color:oklch(0.2 0.012 250);max-width:58ch\">\"Squads say this section changed the most. Writing down what you're leaving out this quarter is uncomfortable. It also ends about half the conversations you used to have, because the answer to \"can you just squeeze this in\" now sits on a page everyone has already read.\"<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">05<\u002Fspan><br>1:24–1:50<br>26s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">The hero plan shrinks and<br>joins the other plans in the<br>portfolio map from Film 02.<br>Two plans light up sharing<br>the same outcome.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.55 0.012 250);margin-bottom:8px\">One plan, then all of them<\u002Fdiv>\n        <p style=\"margin:0;font-size:17px;line-height:1.6;color:oklch(0.2 0.012 250);max-width:58ch\">\"One plan is useful to one team. All of them together is what changed the conversation. Once every squad's plan sits in the same place, you can see where two teams are chasing the same outcome, where one is waiting on another, and where nobody has picked something up at all.\"<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:oklch(0.5 0.012 250)\">Reuse the Film 02 map asset. The visual link between the two explainers does a lot of work for very little animation.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">06<\u002Fspan><br>1:50–2:16<br>26s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:repeating-linear-gradient(135deg,oklch(0.925 0.008 250) 0 6px,oklch(0.955 0.006 250) 6px 12px);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:oklch(0.42 0.012 250)\">Back on the plan. Small<br>labels attach to the margin<br>as the VO names each role:<br>WRITES / EDITS / READS.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:14px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.55 0.012 250);margin-bottom:8px\">Who writes it, who reads it<\u002Fdiv>\n        <p style=\"margin:0;font-size:17px;line-height:1.6;color:oklch(0.2 0.012 250);max-width:58ch\">\"The squad writes it. The product owner holds the pen and the whole team argues about it. It gets refreshed each quarter and edited whenever something material changes. Your hub lead reads it, the squads around you read it, and anyone who wants to know what you're working on reads it instead of booking time with you.\"<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:oklch(0.5 0.012 250)\">Confirm the real ownership and refresh rules with the POM team before recording. This is the scene people will quote back.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:96px 340px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid oklch(0.86 0.008 250);align-items:start\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:oklch(0.52 0.012 250)\"><span style=\"color:oklch(0.24 0.012 250);font-size:15px\">07<\u002Fspan><br>2:16–2:30<br>14s<\u002Fdiv>\n    <div style=\"aspect-ratio:16/9;border:1px solid oklch(0.84 0.008 250);background:oklch(0.22 0.012 250);display:flex;align-items:flex-end;padding:20px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.6;color:oklch(0.96 0.005 250)\">The template, and someone<br>who'll sit with you<br>→ [link]<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.55 0.012 250);margin-bottom:8px\">Close<\u002Fdiv>\n      <p style=\"margin:0;font-size:17px;line-height:1.6;color:oklch(0.2 0.012 250);max-width:58ch\">\"If your squad hasn't written one yet, the first draft takes an afternoon. The argument about the outcome takes a week. Both are worth it, and you don't have to do either on your own.\"<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"margin-top:100px;padding-top:36px;border-top:2px solid oklch(0.24 0.012 250)\">\n  <h2 style=\"font-size:34px;font-weight:600;letter-spacing:-0.02em;margin:0\">What we need from Medibank<\u002Fh2>\n  <div style=\"margin-top:30px;display:grid;gap:1px;background:oklch(0.86 0.008 250);border:1px solid oklch(0.86 0.008 250)\">\n    <div style=\"background:oklch(0.995 0.003 250);padding:22px 26px;display:grid;grid-template-columns:1fr 220px;gap:26px;align-items:baseline\">\n      <div style=\"font-size:16px;line-height:1.5\">Five interviewees confirmed, with their own desks or squad spaces available for an hour each<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:oklch(0.52 0.012 250)\">Before shoot date<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:oklch(0.995 0.003 250);padding:22px 26px;display:grid;grid-template-columns:1fr 220px;gap:26px;align-items:baseline\">\n      <div style=\"font-size:16px;line-height:1.5\">One hero product plan, cleared for screen, numbers redacted rather than replaced<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:oklch(0.52 0.012 250)\">Blocks Film 03<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:oklch(0.995 0.003 250);padding:22px 26px;display:grid;grid-template-columns:1fr 220px;gap:26px;align-items:baseline\">\n      <div style=\"font-size:16px;line-height:1.5\">Portfolio taxonomy export with real hub and product names<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:oklch(0.52 0.012 250)\">Blocks Film 02 sc. 04<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:oklch(0.995 0.003 250);padding:22px 26px;display:grid;grid-template-columns:1fr 220px;gap:26px;align-items:baseline\">\n      <div style=\"font-size:16px;line-height:1.5\">Decision rights confirmed for squad, hub and leadership, signed off by the POM lead<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:oklch(0.52 0.012 250)\">Blocks Film 02 sc. 06<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:oklch(0.995 0.003 250);padding:22px 26px;display:grid;grid-template-columns:1fr 220px;gap:26px;align-items:baseline\">\n      <div style=\"font-size:16px;line-height:1.5\">Any cleared cycle time or throughput figure we are allowed to say out loud<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:oklch(0.52 0.012 250)\">Optional, high value<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:oklch(0.995 0.003 250);padding:22px 26px;display:grid;grid-template-columns:1fr 220px;gap:26px;align-items:baseline\">\n      <div style=\"font-size:16px;line-height:1.5\">Glossary check on product, squad, hub, outcome and product plan<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:oklch(0.52 0.012 250)\">Before VO record<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:26px 0 0;font-size:15px;line-height:1.65;color:oklch(0.44 0.012 250);max-width:80ch\">Suggested order: lock the interview list and shoot Film 01 first, since the rushes will tell us which lines the explainers no longer need to carry. Animate Film 03 second, while the hero plan is fresh, and Film 02 last so its map asset can be reused in both.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showInterviewGuide&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;showVersionB&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;showProductionNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      showGuide: this.props.showInterviewGuide ?? true,\n      showB: this.props.showVersionB ?? true,\n      showNotes: this.props.showProductionNotes ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
